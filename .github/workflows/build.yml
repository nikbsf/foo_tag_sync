name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # windows-latest is a moving alias (now windows-2025-vs2026, which ships
    # only VS2026 whose v143 toolset lacks ATL). windows-2025 has VS2022 17.x
    # with a v143 toolset and a matching ATL component.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap foobar2000 SDK layout
        id: bootstrap
        shell: pwsh
        run: ./bootstrap.ps1

      - name: Locate VS2022 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instances = & $vswhere -all -products * -format json | ConvertFrom-Json
          $vs = $instances | Where-Object { $_.installationVersion -like '17.*' } | Select-Object -First 1
          if (-not $vs) {
            Write-Host "##[error]No Visual Studio 2022 instance found. Available instances:"
            $instances | ForEach-Object { Write-Host "  $($_.installationVersion) $($_.installationPath)" }
            throw "Visual Studio 2022 (17.x) not found on the image"
          }
          $vsPath = $vs.installationPath
          "MSBUILD=$vsPath\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
          Write-Host "VS2022: $vsPath ($($vs.installationVersion))"
          # Insurance against runner-images#9873 (atlmfc missing from the default
          # include path): cl.exe also honors the INCLUDE/LIB environment variables.
          $atlmfc = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
                    Where-Object { Test-Path "$($_.FullName)\atlmfc\include\atlbase.h" }
          if ($atlmfc) {
            "INCLUDE=" + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\include" }) -join ';') >> $env:GITHUB_ENV
            "LIB="     + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\lib\x86" }) -join ';') >> $env:GITHUB_ENV
            Write-Host "atlmfc: $(($atlmfc | ForEach-Object { $_.FullName }) -join ';')"
          }
          else {
            Write-Host "##[warning]atlmfc not found under $vsPath\VC\Tools\MSVC"
          }

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: nuget.exe restore foo_tag_sync.sln -PackagesDirectory src\packages -NonInteractive

      - name: Build (Release Win32)
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: '& $env:MSBUILD foo_tag_sync.sln /p:Configuration=Release /p:Platform=x86 /m /nologo /v:m'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_tag_sync-win32-release
          path: ${{ steps.bootstrap.outputs.build_dir }}\artifacts\Release\foo_tag_sync.dll
          if-no-files-found: error
