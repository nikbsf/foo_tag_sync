name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap foobar2000 SDK layout
        id: bootstrap
        shell: pwsh
        run: ./bootstrap.ps1

      # Pin the build to VS2022: v143 (14.4x) and its ATL are aligned there.
      # vswhere -latest would pick VS2026, whose v143 toolset lacks atlmfc,
      # breaking ATLHelpers with C1083 (see actions/runner-images#9873).
      - name: Locate VS2022 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version "[17.0,18.0)" -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 (17.x) not found on the image" }
          "MSBUILD=$vs\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
          Write-Host "VS2022: $vs"
          # Insurance against #9873 (atlmfc missing from the default include path):
          # cl.exe also honors the INCLUDE/LIB environment variables.
          $atlmfc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                    Where-Object { Test-Path "$($_.FullName)\atlmfc\include\atlbase.h" }
          if ($atlmfc) {
            "INCLUDE=" + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\include" }) -join ';') >> $env:GITHUB_ENV
            "LIB="     + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\lib\x86" }) -join ';') >> $env:GITHUB_ENV
            Write-Host "atlmfc: $(($atlmfc | ForEach-Object { $_.FullName }) -join ';')"
          }
          else {
            Write-Host "##[warning]atlmfc not found under $vs\VC\Tools\MSVC"
          }

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: nuget.exe restore foo_tag_sync.sln -PackagesDirectory src\packages -NonInteractive

      - name: Build (Release Win32)
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: '& $env:MSBUILD foo_tag_sync.sln /p:Configuration=Release /p:Platform=x86 /m /nologo /v:m'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_tag_sync-win32-release
          path: ${{ steps.bootstrap.outputs.build_dir }}\artifacts\Release\foo_tag_sync.dll
          if-no-files-found: error
