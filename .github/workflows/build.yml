name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # windows-2025 (and the windows-latest alias) currently provision the
    # windows-2025-vs2026 image: VS2026 only, whose default toolset is v145
    # with a matching ATL component. We build with v145 everywhere.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap foobar2000 SDK layout
        id: bootstrap
        shell: pwsh
        run: ./bootstrap.ps1

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Insurance against runner-images#9873-style drift (atlmfc missing from
      # the default include path): cl.exe also honors INCLUDE/LIB env vars.
      - name: Add atlmfc to INCLUDE/LIB
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "No Visual Studio instance found on the image" }
          Write-Host "Visual Studio: $vs"
          $atlmfc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                    Where-Object { Test-Path "$($_.FullName)\atlmfc\include\atlbase.h" }
          if ($atlmfc) {
            "INCLUDE=" + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\include" }) -join ';') >> $env:GITHUB_ENV
            "LIB="     + (($atlmfc | ForEach-Object { "$($_.FullName)\atlmfc\lib\x86" }) -join ';') >> $env:GITHUB_ENV
            Write-Host "atlmfc: $(($atlmfc | ForEach-Object { $_.FullName }) -join ';')"
          }
          else {
            $instances = & $vswhere -all -products * -format json | ConvertFrom-Json
            Write-Host "##[error]atlmfc not found. Available instances:"
            $instances | ForEach-Object { Write-Host "  $($_.installationVersion) $($_.installationPath)" }
            throw "atlmfc not found under $vs\VC\Tools\MSVC - install the VC.ATL component"
          }

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: nuget.exe restore foo_tag_sync.sln -PackagesDirectory src\packages -NonInteractive

      - name: Build (Release Win32)
        shell: pwsh
        working-directory: ${{ steps.bootstrap.outputs.build_dir }}
        run: msbuild foo_tag_sync.sln /p:Configuration=Release /p:Platform=x86 /m /nologo /v:m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_tag_sync-win32-release
          path: ${{ steps.bootstrap.outputs.build_dir }}\artifacts\Release\foo_tag_sync.dll
          if-no-files-found: error
